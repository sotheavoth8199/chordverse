<!doctype html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Contact</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Barlow:wght@300;400;600;700&display=swap" rel="stylesheet">
  <link href="../assets/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" rel="stylesheet">
  <link href="../assets/css/style.css" rel="stylesheet">
</head>
<body>
  <div id="site-header"></div>
  <main>
    <section class="page-hero"><div class="container"><p class="eyebrow guitar-hero-kicker"><i class="fa-solid fa-envelope me-2 contact-hero-icon" aria-hidden="true"></i>Get in touch</p><h1 class="display-heading">CONTACT <span>US</span></h1><p class="lead-copy">Have questions? Want to collaborate? Just want to talk music? We'd love to hear from you.</p></div></section>
    <section class="section-space"><div class="container"><div class="row g-5">
      <aside class="col-lg-5"><h2 class="display-heading mb-4 guitar-hero-kicker">REACH<br><span>US</span></h2>
        <div class="contact-detail"><span><i class="fa-solid fa-envelope"></i></span><div><small>Email</small><p>sotheavothtann@gmail.com</p></div></div>
        <div class="contact-detail"><span><i class="fa-solid fa-phone"></i></span><div><small>Phone</small><p>+ (855) 60-504-315</p></div></div>
        <div class="contact-detail"><span><i class="fa-solid fa-location-dot"></i></span><div><small>Address</small><p>Siem Reap<br>Cambodia</p></div></div>
        <!-- <div class="contact-detail"><span><i class="fa-regular fa-clock"></i></span><div><small>Hours</small><p>Mon–Fri: 9am – 6pm<br>Weekend: 10am – 4pm</p></div></div> -->
      </aside>
      <div class="col-lg-7"><div class="card contact-card"><div class="alert alert-info d-none" id="contact-feedback" role="status" aria-live="polite"></div>
        <form id="contact-form" action="https://formsubmit.co/ajax/sotheavothtann@gmail.com" method="POST" novalidate>
          <div class="row g-3 mb-3">
            <div class="col-sm-6"><label class="form-label" for="name">Name <span class="text-brand">*</span></label><input class="form-control" id="name" name="name" type="text" placeholder="John Mayer" required maxlength="100"></div>
            <div class="col-sm-6"><label class="form-label" for="email">Email <span class="text-brand">*</span></label><input class="form-control" id="email" name="email" type="email" placeholder="you@example.com" required maxlength="150"></div>
          </div>
          <div class="mb-3"><label class="form-label" for="subject">Subject</label><input class="form-control" id="subject" name="subject" type="text" placeholder="Lesson inquiry..." maxlength="200"></div>
          <div class="mb-4"><label class="form-label" for="message">Message <span class="text-brand">*</span></label><textarea class="form-control" id="message" name="message" rows="6" placeholder="Tell us what's on your mind..." required minlength="10"></textarea></div>
          <button class="btn btn-brand w-100" type="submit"><i class="fa-solid fa-paper-plane me-2"></i>Send Message</button>
          <p class="small text-secondary mt-3 mb-0">Your message will be sent through FormSubmit to our inbox.</p>
        </form>
      </div></div>
    </div></div></section>
  </main>
  <div id="site-footer"></div>
  <script src="../assets/js/bootstrap.bundle.min.js"></script>
  <script src="../assets/js/main.js"></script>
</body>
</html>
